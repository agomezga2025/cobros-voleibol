<!doctype html>
<!--
  ============================================================
  Archivo:   index.html
  Versión:   1.0.0
  Última modificación: 27-10-2026
  ------------------------------------------------------------
  Descripción:
    Punto de entrada de la app de cobros de voleibol.
    - Enlaza el manifest para que, al añadirla a la pantalla
      de inicio, arranque siempre en "/" y en modo app.
    - Añade las etiquetas de Apple para iOS (sin barra de Safari)
      y el icono que se muestra en la pantalla de inicio.
  ============================================================
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cobros voleibol</title>

    <!-- Icono de la pestaña y de la pantalla de inicio (archivo en /public) -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Web app: manifest + modo app en iOS -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cobros" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
