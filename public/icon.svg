<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6b22"/>
      <stop offset="1" stop-color="#1f3710"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4ecdc"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd257"/>
      <stop offset="1" stop-color="#e9a41b"/>
    </linearGradient>
    <clipPath id="ballClip"><circle cx="0" cy="0" r="270"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Balón -->
  <g transform="translate(470 480)">
    <circle r="282" fill="#1a2e0d" opacity="0.35" transform="translate(10 16)"/>
    <circle r="270" fill="url(#ball)"/>
    <g clip-path="url(#ballClip)" fill="none" stroke="#2b4a17" stroke-width="16" stroke-linecap="round">
      <g id="seam">
        <path d="M0,0 C 70,-60 190,-60 300,10"/>
        <path d="M-30,-95 C 60,-150 190,-150 300,-90"/>
      </g>
      <use href="#seam" transform="rotate(120)"/>
      <use href="#seam" transform="rotate(240)"/>
    </g>
    <circle r="270" fill="none" stroke="#2b4a17" stroke-width="16"/>
  </g>

  <!-- Moneda € -->
  <g transform="translate(716 716)">
    <circle r="128" fill="#2b4a17"/>
    <circle r="112" fill="url(#coin)"/>
    <circle r="88" fill="none" stroke="#b97a0a" stroke-width="6" opacity="0.6"/>
    <text x="0" y="44" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="128" fill="#5a3a00">€</text>
  </g>
</svg>
